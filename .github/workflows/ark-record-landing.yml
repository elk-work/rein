# Recorder vendored from elk-work/elk; no private repository checkout.
# Closes Ark tasks named by a merged PR and records its landing. Rein's Ark repository is 01M17TTM53XJKBZW2M9E04HHYP.
# Public repository: only same-repository merges may receive credentials.
# Cost: one ubuntu-slim job per eligible merge, about $0.002 per billed minute.
name: ark-record-landing

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      hours:
        description: "Backfill window in hours"
        default: '48'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ark-record-landing
  cancel-in-progress: false

jobs:
  record:
    if: >-
      github.repository == 'elk-work/rein' &&
      (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      (github.event.pull_request.user.type != 'Bot' ||
       contains(format('{0} {1}', github.event.pull_request.title, github.event.pull_request.body), 'ark:'))))
    runs-on: ${{ vars.LINUX_RUNNER != '' && fromJSON(vars.LINUX_RUNNER) || 'ubuntu-slim' }}
    timeout-minutes: 10
    steps:
      - name: Check for an Ark write credential
        id: credential
        env:
          ARK_TOKEN: ${{ secrets.ARK_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$ARK_TOKEN" ]; then
            echo "::warning::ARK_TOKEN is absent; this landing will not be recorded until the PM provisions the Ark write credential."
            exit 0
          fi
          echo 'available=true' >> "$GITHUB_OUTPUT"

      - name: Check out Rein's recorder
        if: steps.credential.outputs.available == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github

      - name: Record the landing
        if: steps.credential.outputs.available == 'true'
        env:
          ARK_TOKEN: ${{ secrets.ARK_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
          HOURS: ${{ inputs.hours || '48' }}
        run: bash .github/ark-record-landing.sh
